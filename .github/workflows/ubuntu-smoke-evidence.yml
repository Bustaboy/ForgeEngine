name: Ubuntu Smoke Evidence (AT-011)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ubuntu-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMPDIR: ${{ github.workspace }}/.tmp/ubuntu-smoke
      AVALONIA_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create temp directory
        run: mkdir -p "$TMPDIR"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libvulkan-dev libglfw3-dev

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run Ubuntu smoke capture (AT-011)
        run: >
          python scripts/run_smoke_and_capture_evidence.py
          --os ubuntu
          --output-root docs/release/evidence/runs
          --operator github-actions

      - name: Validate smoke evidence schema
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "run_smoke",
              Path("scripts/run_smoke_and_capture_evidence.py"),
          )
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          validate_evidence_payload = mod.validate_evidence_payload

          runs = sorted(Path("docs/release/evidence/runs").glob("*/smoke_evidence.json"))
          if not runs:
              sys.exit("no smoke_evidence.json found")
          payload = json.loads(runs[-1].read_text(encoding="utf-8"))
          errors = validate_evidence_payload(payload)
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          if payload.get("verdict") != "PASS":
              sys.exit(f"smoke verdict was {payload.get('verdict')}")
          print(f"Validated {runs[-1]}")
          PY

      - name: Upload smoke evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-smoke-evidence
          path: docs/release/evidence/runs/
          if-no-files-found: error

  archive-on-main:
    needs: ubuntu-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download smoke evidence
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-smoke-evidence
          path: docs/release/evidence/runs

      - name: Archive to tracked path and promote AT-011
        run: |
          RUN_DIR=$(ls -1d docs/release/evidence/runs/*/ | sort | tail -1)
          RUN_ID=$(basename "$RUN_DIR")
          DEST="docs/release/evidence/archived/ubuntu/${RUN_ID}"
          mkdir -p "$DEST"
          cp -a "${RUN_DIR}/." "$DEST/"
          python scripts/promote_smoke_acceptance.py --os ubuntu --run-id "$RUN_ID"
          python scripts/validate_traceability.py

      - name: Commit archived Ubuntu smoke evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/evidence/archived/ubuntu docs/release/acceptance_traceability_v1.json docs/release/acceptance_traceability_v1.md
          if git diff --staged --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git commit -m "chore(evidence): archive Ubuntu smoke run and promote AT-011"
          git push
