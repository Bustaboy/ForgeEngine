name: PR Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.tmp/traceability

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create temp directory
        run: mkdir -p "$TMPDIR"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Validate traceability metadata
        run: python scripts/validate_traceability.py

      - name: Run traceability validator tests
        run: python -m pytest -q tests/test_traceability_validator.py -p no:cacheprovider

  python-tests:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.tmp/python-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create temp directory
        run: mkdir -p "$TMPDIR"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libvulkan-dev libglfw3-dev

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run full Python test suite
        run: python -m pytest -q tests/ -p no:cacheprovider

  csharp-tests:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.tmp/csharp-tests
      AVALONIA_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create temp directory
        run: mkdir -p "$TMPDIR"

      - name: Restore C# test project
        run: dotnet restore editor/csharp/tests/Soul.Editor.Tests.csproj --nologo

      - name: Run full C# editor test suite
        run: >
          dotnet test editor/csharp/tests/Soul.Editor.Tests.csproj
          --no-restore
          -c Release
          -v minimal
          --nologo
